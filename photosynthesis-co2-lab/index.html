<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>验证光合作用需要二氧化碳</title><link rel="stylesheet" href="./experiment.css"></head><body>
<header><div><h1>验证光合作用需要二氧化碳</h1><p>选自北师大版 · 七年级上册　｜　第4章 第1节 光合作用</p></div><nav><button id="prepare" class="active">准备实验</button><button id="start">开始实验</button></nav></header>
<main id="viewport" aria-label="二氧化碳对照实验"><div id="labels"></div><div id="tooltip" hidden></div><section id="guide"><span id="phase">准备实验</span><h2 id="step-title">认识实验材料</h2><p id="instruction">A组为清水对照组，B组为氢氧化钠实验组。点击“开始实验”，按步骤观察两组操作。</p><div id="time-note" hidden></div></section><div id="pair-status" hidden><span id="a-status">A组 · 待开始</span><span id="b-status">B组 · 待开始</span></div><section id="leaf-observations" aria-label="叶片颜色同步放大观察" hidden><figure><figcaption>A组 · 叶片放大观察</figcaption><canvas id="leaf-view-a"></canvas></figure><figure><figcaption>B组 · 叶片放大观察</figcaption><canvas id="leaf-view-b"></canvas></figure></section><div id="result" hidden></div></main>
<footer><div id="step-navigator"><button id="step-nav-toggle" aria-expanded="false">步骤导航</button><section id="step-menu" hidden><header><strong>选择讲解步骤</strong><div><button id="jump-prev">上一步</button><button id="jump-next">下一步</button></div></header><p>选择后直接恢复到该步骤开始前的正确状态。</p><div class="step-group"><span>前期处理</span><button data-step="0">01 加入清水</button><button data-step="1">02 插入枝条</button><button data-step="2">03 暗处理</button></div><div class="step-group"><span>对照实验</span><button data-step="3">04 摆放装置</button><button data-step="4">05 加入试剂</button><button data-step="5">06 盖钟罩</button><button data-step="6">07 凡士林密封</button><button data-step="7">08 阳光照射</button></div><div class="step-group"><span>叶片检验</span><button data-step="8">09 摘取叶片</button><button data-step="9">10 准备水浴</button><button data-step="10">11 加热脱色</button><button data-step="11">12 漂洗叶片</button><button data-step="12">13 滴加碘液</button><button data-step="13">14 比较结果</button></div></section></div><div class="progress"><span id="status">准备就绪</span><div class="track"><div id="progress-fill"></div></div></div><div class="controls"><button id="next" disabled>下一步</button><button id="demo">全部演示</button><button id="pause" hidden>暂停</button><button id="overview">全景</button><button id="reset-experiment">重置实验</button><div id="speed-control" role="group" aria-label="演示速度"><span>速度</span><button data-speed="1">1×</button><button data-speed="1.25">1.25×</button><button data-speed="1.5">1.5×</button><button data-speed="2">2×</button><select id="speed-select" aria-label="演示速度"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div><button id="full">全屏</button></div></footer>
<div hidden><button id="all">全部材料</button><button id="empty">只看实验台</button><button id="cabinet">打开暗处理柜</button><button id="reset">复位视图</button></div>
<script defer src="./app.bundle.js"></script></body></html>
