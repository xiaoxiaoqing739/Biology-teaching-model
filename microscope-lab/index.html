<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="双目电光源显微镜结构认识与模拟实验教学工具">
  <title>双目电光源显微镜 · 3D交互模拟</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23234838'/%3E%3Cpath d='M25 10h14v8H25zm4 8h6v17h-6zm-9 18h25v6H20zm5 7h15c0 8-4 11-8 11s-7-3-7-11z' fill='%23dadfc5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=20260925-4">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">µ</span><div><strong>双目电光源显微镜</strong><small>3D 交互模拟实验室</small></div></div>
    <nav class="mode-switch" aria-label="教学模式">
      <button class="active" data-mode="explore">认识结构</button>
      <button data-mode="experiment">进入实验</button>
    </nav>
    <div class="top-actions"><button id="fullscreenBtn" aria-pressed="false">全屏</button><button id="layoutBtn">布局</button><button id="helpBtn">说明</button></div>
  </header>

  <main id="workspace" class="workspace">
    <section id="modelPane" class="model-pane" aria-label="显微镜三维模型">
      <canvas id="threeCanvas"></canvas>
      <section id="scopeOverlay" class="scope-overlay" aria-label="放大的显微镜视野" hidden>
        <header><div><small>显微镜视野</small><strong id="overlayMagnification">100×</strong></div><button id="closeScopeOverlay" aria-label="关闭放大视野">×</button></header>
        <div class="scope-overlay-stage"><canvas id="expandedScopeCanvas" width="900" height="900"></canvas><span class="crosshair">＋</span></div>
        <p>鼠标滚轮或双指缩放，拖动可同步移动玻片</p>
      </section>
      <div class="view-presets" aria-label="预设视角">
        <button data-view="front">正面</button><button data-view="back">背面</button>
        <button data-view="side">侧面</button><button data-view="aperture">看光圈</button>
        <button data-view="focus">调焦机构</button><button data-view="home">复位</button>
      </div>
      <div class="camera-tools">
        <button data-camera="zoomIn" aria-label="放大">＋</button><button data-camera="zoomOut" aria-label="缩小">−</button>
        <button data-camera="toggle" id="cameraMode">旋转</button><button data-camera="focus">聚焦所选</button>
      </div>
      <div class="nudge-pad" aria-label="平移视角">
        <button data-nudge="up">↑</button><button data-nudge="left">←</button><button data-nudge="down">↓</button><button data-nudge="right">→</button>
      </div>
      <div id="partLabel" class="part-label" hidden></div>
      <aside id="infoCard" class="info-card">
        <div class="info-kicker"><span id="partCount">结构导览</span><button id="closeInfo" aria-label="关闭">×</button></div>
        <h2 id="partName">点击显微镜部件</h2>
        <p id="partDesc">选择一个部件，查看教材名称、作用和操作提示。</p>
        <p id="partTip" class="info-tip">可拖动空白处旋转模型，滚轮缩放。</p>
      </aside>
      <details class="structure-index">
        <summary>结构索引 · 20</summary><div id="structureList"></div>
      </details>
    </section>

    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>

    <aside id="controlPane" class="control-pane">
      <section class="eyepiece-card">
        <div class="scope-head"><div><small>当前总倍率</small><strong id="magnification">100×</strong></div><div class="scope-head-actions"><span id="qualityBadge">等待放片</span><button id="expandScopeBtn">放大查看</button></div></div>
        <div class="scope-wrap"><canvas id="scopeCanvas" width="640" height="640"></canvas><span class="crosshair">＋</span></div>
        <div class="status-lines"><span id="focusStatus">等待放片</span><span id="lightStatus">光源未开启</span></div>
        <div class="mini-previews">
          <figure><canvas id="slideCanvas" width="520" height="150"></canvas><figcaption>玻片位置</figcaption></figure>
        </div>
      </section>

      <div class="tabs" role="tablist">
        <button class="active" data-tab="light">① 对光</button><button data-tab="slide">② 装片</button><button data-tab="focus">③ 调焦/倍率</button>
      </div>

      <section class="panel active" data-panel="light">
        <button id="powerButton" class="power-button"><span></span><b>打开电源</b></button>
        <label>虹膜光圈 <output id="apertureOut">3</output><input id="aperture" type="range" min="0" max="4" step="1"></label>
        <div class="range-caption"><span>小光圈 · 较暗</span><span>大光圈 · 较亮</span></div>
        <label>灯光亮度 <output id="intensityOut">50%</output><input id="intensity" type="range" min="0" max="100"></label>
      </section>

      <section class="panel" data-panel="slide">
        <label>玻片标本<select id="specimen"><option value="none">空载物台</option><optgroup label="倒像观察（演示用）"><option value="shang">「上」字装片（楷体）</option><option value="e">「e」字装片（粗黑）</option></optgroup><optgroup label="细胞观察（实拍）"><option value="kouqiang">口腔上皮细胞</option><option value="genjian">根尖细胞</option></optgroup><optgroup label="组织观察（实拍）"><option value="shangpi">上皮组织</option><option value="jiedi">结缔组织</option><option value="jirou">肌肉组织</option><option value="shenjing">神经组织</option><option value="candou">蚕豆叶下表皮</option><option value="yingchun">迎春叶横切</option><option value="nangua">南瓜茎纵切</option></optgroup></select></label>
        <label>横向手轮 <output id="slideXOut">0.00</output><input id="slideX" type="range" min="-0.8" max="0.8" step="0.01"></label>
        <label>纵向手轮 <output id="slideYOut">0.00</output><input id="slideY" type="range" min="-0.8" max="0.8" step="0.01"></label>
        <div class="slide-pad"><button data-slide="up">上</button><button data-slide="left">左</button><button data-slide="center">居中</button><button data-slide="right">右</button><button data-slide="down">下</button></div>
      </section>

      <section class="panel" data-panel="focus">
        <fieldset><legend>物镜</legend><div class="segments"><button data-objective="4">4×</button><button class="active" data-objective="10">10×</button><button data-objective="40">40×</button></div></fieldset>
        <label>目镜<select id="eyepiece"><option>5</option><option selected>10</option><option>16</option></select></label>
        <label>粗准焦螺旋 <output id="coarseOut">台高刻度 5.000</output><input id="coarse" type="range" min="0" max="10" step="0.05"></label>
        <label>细准焦螺旋 <output id="fineOut">0.000</output><input id="fine" type="range" min="-0.5" max="0.5" step="0.005"></label>
        <div class="micro-buttons"><button data-fine="-0.01">微升</button><button data-fine="0">归中</button><button data-fine="0.01">微降</button></div>
        <details class="binocular-settings"><summary>双眼配准</summary>
          <label>瞳距 <output id="ipdOut">64 mm</output><input id="ipd" type="range" min="55" max="75"></label>
          <label>左目视度 <output id="diopterOut">0 D</output><input id="diopter" type="range" min="-3" max="3" step="0.1"></label>
        </details>
      </section>

      <button id="resetButton" class="reset-button">全部重置</button>
    </aside>
  </main>

  <dialog id="layoutDialog"><form method="dialog"><h2>工作区布局</h2><p>选择模型与操作面板的空间比例。</p><div class="dialog-options"><button value="model" data-layout="model">模型优先</button><button value="balanced" data-layout="balanced">均衡</button><button value="control" data-layout="control">操作优先</button></div><button value="cancel">关闭</button></form></dialog>
  <dialog id="helpDialog"><form method="dialog"><h2>课堂操作提示</h2><ol><li>先在“认识结构”中点击部件，熟悉名称与作用。</li><li>进入实验后，依次打开电源、放置玻片、低倍找像并调焦。</li><li>换高倍前先将目标移到视野中央，之后只用细准焦螺旋。</li></ol><button value="close">知道了</button></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="./offline-app.js?v=20260928-2"></script>
</body>
</html>
