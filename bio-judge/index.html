<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>判断生物与非生物 · 16:9 教学版</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#0f1210;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:#1f2320;}

.stage-wrap{position:fixed;inset:0;overflow:hidden;background:#0f1210;}

.stage{
  width:1600px;height:900px;position:absolute;left:50%;top:50%;
  background:#f6f7f5;overflow:hidden;transform-origin:center center;
  font-size:14px;line-height:1.6;
}
.stage-inner{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:top left;transform:scale(1.25);overflow:hidden}

/* Header */
.header{position:absolute;left:0;right:0;top:0;height:80px;display:flex;align-items:center;gap:14px;padding:0 24px;background:#fff;border-bottom:1px solid #e2e4e0;z-index:5;}
.chapter{font-size:12.5px;color:#4a524a;font-weight:600;letter-spacing:.5px;margin-bottom:2px}
.title{font-size:20px;font-weight:500;}
.subtitle{font-size:12px;color:#5f665e;margin-left:8px}
.spacer{flex:1;}
.modes{display:flex;background:#f6f7f5;border:1px solid #e2e4e0;border-radius:8px;padding:2px;}
.modes button{border:0;background:transparent;padding:5px 12px;font:inherit;font-size:12px;color:#5f665e;cursor:pointer;border-radius:6px;}
.modes button.active{background:#1f2320;color:#fff;}
.btn{border:1px solid #c9ccc6;background:#fff;color:#1f2320;font:inherit;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;}
.btn:hover{border-color:#5f665e;}
.btn.primary{background:#1f2320;color:#fff;border-color:#1f2320;}
.btn.primary:hover{background:#3a3f3a;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.stat{font-size:12px;color:#5f665e;display:flex;align-items:center;gap:6px;}
.stat b{color:#1f2320;font-weight:500;font-size:14px;}
.bar{width:120px;height:5px;background:#e2e4e0;border-radius:99px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:#639922;transition:width .25s;}

/* Pool */
.pool{position:absolute;left:24px;right:24px;top:98px;height:268px;background:#fff;border:1.5px dashed #c9ccc6;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;}
.pool-title{font-size:12px;color:#5f665e;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.pool-title .tag{padding:2px 8px;background:#eaf3de;color:#3b6d11;border-radius:99px;font-size:11px;font-weight:500;}
.pool-title .tag2{padding:2px 8px;background:#e6f1fb;color:#0c447c;border-radius:99px;font-size:11px;font-weight:500;}
.pool-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;}

/* Zones */
.zones{position:absolute;left:24px;right:24px;bottom:20px;top:382px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.zone{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;min-height:0;}
.zone.live{background:#eaf3de;border:1px solid #c0dd97;}
.zone.non{background:#e6f1fb;border:1px solid #b5d4f4;}
.zone h2{margin:0 0 4px;font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px;}
.zone.live h2{color:#3b6d11;}
.zone.non h2{color:#0c447c;}
.zone .count{margin-left:auto;font-size:12px;font-weight:400;color:#5f665e;}
.zone .desc{font-size:12px;color:#5f665e;margin:0 0 8px;}
.drop{flex:1;min-height:0;border-radius:10px;border:1.5px dashed #c9ccc6;background:rgba(255,255,255,.55);padding:8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px;overflow:hidden;}
.zone.live .drop{border-color:#c0dd97;}
.zone.non .drop{border-color:#b5d4f4;}
.zone.hover{outline:2.5px solid #1f2320;outline-offset:-2px;}

/* Tile (image card) */
.tile{position:relative;min-width:0;min-height:0;border-radius:8px;overflow:hidden;background:#fff;border:1.5px solid #c9ccc6;cursor:grab;user-select:none;touch-action:none;transition:transform .15s,box-shadow .15s,border-color .15s;}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.08);}
.tile.locked{cursor:default;}
.tile.locked:hover{transform:none;box-shadow:none;}
.tile.selected{box-shadow:0 0 0 2.5px #1f2320,0 6px 14px rgba(0,0,0,.1);}
.tile img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;background:#eef0ec;}
.tile .label{position:absolute;left:0;right:0;bottom:0;padding:5px 7px 4px;font-size:12px;color:#fff;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.5);background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.78) 80%);}
.tile.ok{border-color:#639922;}
.tile.no{border-color:#185fa5;}
.tile.wrong{animation:shake .38s ease;border-color:#a32d2d;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.tile.dragging{opacity:.25;transform:none;box-shadow:none;}
.tile-ghost{position:fixed;z-index:999;pointer-events:none;box-shadow:0 12px 28px rgba(0,0,0,.25);transform:rotate(-1.5deg);border-radius:8px;overflow:hidden;}

/* Review screen */
.review{position:absolute;inset:0;background:#f6f7f5;display:none;z-index:50;}
.review.show{display:flex;}
.review-inner{flex:1;display:grid;grid-template-columns:1.05fr 1fr;min-height:0;}
.review-img{position:relative;background:#0f1210;display:flex;align-items:center;justify-content:center;padding:30px;min-height:0;}
.review-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);}
.review-img .badge{position:absolute;top:24px;left:24px;padding:6px 14px;border-radius:99px;font-size:13px;color:#fff;letter-spacing:.5px;}
.badge.live{background:#3b6d11;}
.badge.non{background:#0c447c;}
.review-close{position:absolute;top:24px;right:24px;}
.review-body{padding:28px 36px;display:flex;flex-direction:column;min-height:0;overflow:auto;}
.review-body h3{margin:0 0 4px;font-size:26px;font-weight:500;}
.review-body .summary{font-size:13px;color:#5f665e;margin-bottom:18px;line-height:1.6;}
.dim-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:12px;flex:1;min-height:0;}
.dim{background:#fff;border:1px solid #e2e4e0;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;min-height:0;}
.dim .mark{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;margin-bottom:8px;flex-shrink:0;}
.dim .mark.y{background:#639922;}
.dim .mark.n{background:#c9ccc6;color:#888;}
.dim .title{font-size:13px;font-weight:500;color:#1f2320;margin-bottom:4px;}
.dim .note{font-size:12px;color:#5f665e;line-height:1.5;}
.review-footer{display:flex;align-items:center;gap:10px;padding-top:16px;border-top:1px solid #e2e4e0;margin-top:14px;}
.review-footer .progress{flex:1;height:5px;background:#e2e4e0;border-radius:99px;overflow:hidden;}
.review-footer .progress i{display:block;height:100%;background:#1f2320;transition:width .2s;}
.review-footer .step{font-size:12px;color:#5f665e;min-width:88px;text-align:right;}

/* Toast */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);background:#1f2320;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:1500;font-size:13px;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* Success */
.overlay{position:fixed;inset:0;background:rgba(15,18,16,.5);display:none;align-items:center;justify-content:center;z-index:2000;}
.overlay.show{display:flex;}
.panel{background:#fff;border-radius:18px;padding:30px 36px;text-align:center;max-width:380px;width:90%;}
.panel .check{width:56px;height:56px;border-radius:50%;border:2px solid #639922;background:#eaf3de;margin:0 auto 14px;position:relative;}
.panel .check::after{content:"";position:absolute;left:19px;top:14px;width:14px;height:24px;border-right:3px solid #639922;border-bottom:3px solid #639922;transform:rotate(42deg);}
.panel h3{margin:0 0 4px;font-size:20px;font-weight:500;}
.panel p{margin:0 0 14px;font-size:13px;color:#5f665e;}
.panel .meta{font-size:12px;color:#5f665e;margin-bottom:20px;}
.panel .meta b{color:#1f2320;font-weight:500;}
.panel .row{display:flex;gap:10px;justify-content:center;}
</style>
</head>

</div></div></div>

const HINT = '再想一想：它是否有细胞结构？能否独立进行新陈代谢和繁殖？';

const stage    = document.getElementById('stage');
const pool     = document.getElementById('pool');
const drops    = { true: document.getElementById('drop-true'), false: document.getElementById('drop-false') };
const zones    = Array.from(document.querySelectorAll('.zone'));
const toastEl  = document.getElementById('toast');
const overlay  = document.getElementById('overlay');
const submitBtn= document.getElementById('submit');
const scoreEl  = document.getElementById('score');
const barEl    = document.getElementById('bar');
const totalEl  = document.getElementById('total');
const reviewEl = document.getElementById('review');
const rvImg    = document.getElementById('rv-img');
const rvBadge  = document.getElementById('rv-badge');
const rvName   = document.getElementById('rv-name');
const rvSummary= document.getElementById('rv-summary');
const rvDims   = document.getElementById('rv-dims');
const rvStep   = document.getElementById('rv-step');
const rvBar    = document.getElementById('rv-bar');

let mode = 'practice';
let cards = [];
let startedAt = null;
let selected = null;
let toastTimer = null;
let rvIndex = 0;
let reviewItems = [];

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2400);
}

function makeTile(item, id){
  const el = document.createElement('div');
  el.className = 'tile';
  el.dataset.id = id;
  el.dataset.answer = String(item.answer);
  el.tabIndex = 0;
  el.innerHTML = '<img alt="' + item.name + '" src="' + item.img + '"><div class="label">' + item.name + '</div>';
  el.addEventListener('pointerdown', onPointerDown);
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); toggleSelect(el); } });
  return el;
}

function build(){
  reviewEl.classList.remove('show');
  overlay.classList.remove('show');
  startedAt = null;
  selected = null;
  pool.innerHTML=''; drops.true.innerHTML=''; drops.false.innerHTML='';
  cards = shuffle(ITEMS.slice()).map((it,i)=>({...it, dom:null, _id:'c'+i})).map(rec=>{
    const el = makeTile(rec, rec._id);
    rec.dom = el;
    pool.appendChild(el);
    return rec;
  });
  totalEl.textContent = cards.length;
  update();
}

function update(){
  const t = drops.true.children.length, f = drops.false.children.length;
  document.getElementById('count-true').textContent = t + ' 张';
  document.getElementById('count-false').textContent = f + ' 张';
  if(mode === 'practice'){
    const ok = cards.filter(c => c.dom.dataset.zone !== undefined && c.dom.dataset.zone === c.dom.dataset.answer).length;
    scoreEl.textContent = ok;
    barEl.style.width = (ok / cards.length * 100) + '%';
    submitBtn.disabled = true;
    if(ok === cards.length) succeed();
  } else {
    const placed = t + f;
    scoreEl.textContent = placed;
    barEl.style.width = (placed / cards.length * 100) + '%';
    submitBtn.disabled = placed !== cards.length;
  }
}

function toggleSelect(el){
  if(mode === 'practice' && el.dataset.zone) return;
  if(selected === el){ el.classList.remove('selected'); selected = null; return; }
  if(selected) selected.classList.remove('selected');
  selected = el;
  el.classList.add('selected');
}

function startTimer(){ if(!startedAt) startedAt = Date.now(); }

function place(el, zoneEl){
  const ans = zoneEl.dataset.answer;
  startTimer();
  if(mode === 'practice'){
    if(ans !== el.dataset.answer){
      el.classList.remove('ok','no','wrong');
      void el.offsetWidth;
      el.classList.add('wrong');
      setTimeout(()=>el.classList.remove('wrong'), 500);
      pool.appendChild(el);
      delete el.dataset.zone;
      toast(HINT);
      update();
      return;
    }
    el.dataset.zone = ans;
    el.classList.add('ok');
    el.classList.remove('selected');
    drops[ans].appendChild(el);
    if(selected === el) selected = null;
    update();
    return;
  }
  el.dataset.zone = ans;
  el.classList.remove('selected');
  drops[ans].appendChild(el);
  if(selected === el) selected = null;
  update();
}

function checkAll(){
  const wrong = cards.filter(c => !c.dom.dataset.zone || c.dom.dataset.zone !== c.dom.dataset.answer);
  cards.forEach(c=>{ if(c.dom.dataset.zone === c.dom.dataset.answer) c.dom.classList.add(c.dom.dataset.answer==='true'?'ok':'no'); });
  if(wrong.length === 0){ succeed(); return; }
  wrong.forEach(c=>{
    c.dom.classList.add('wrong');
    setTimeout(()=>c.dom.classList.remove('wrong'), 700);
    pool.appendChild(c.dom);
    c.dom.classList.remove('ok','no');
    delete c.dom.dataset.zone;
  });
  toast('有 ' + wrong.length + ' 项分类不正确，已退回，请重新判断。' + HINT);
  update();
}

function succeed(){
  const sec = startedAt ? Math.round((Date.now()-startedAt)/1000) : 0;
  const mm = String(Math.floor(sec/60)).padStart(2,'0'), ss = String(sec%60).padStart(2,'0');
  document.getElementById('ov-sub').textContent = '全部 ' + cards.length + ' 项判断正确';
  document.getElementById('ov-meta').innerHTML = '模式：<b>' + (mode==='practice'?'练习模式':'挑战模式') + '</b>　用时：<b>' + mm + ':' + ss + '</b>';
  overlay.classList.add('show');
}

function startReview(){
  overlay.classList.remove('show');
  reviewItems = cards.slice();
  rvIndex = 0;
  reviewEl.classList.add('show');
  renderReview();
}

function renderReview(){
  const it = reviewItems[rvIndex];
  rvImg.src = it.img;
  rvImg.alt = it.name;
  rvBadge.textContent = it.answer ? '生 物' : '非 生 物';
  rvBadge.className = 'badge ' + (it.answer ? 'live' : 'non');
  rvName.textContent = it.name;
  rvSummary.textContent = it.summary;
  rvDims.innerHTML = DIMS.map(d=>{
    const ok = it.dims[d.key];
    const note = it.dims[d.key + '_n'] || '';
    return '<div class="dim">' +
      '<div class="mark ' + (ok ? 'y' : 'n') + '">' + (ok ? '√' : '×') + '</div>' +
      '<div class="title">' + d.title + '</div>' +
      '<div class="note">' + note + '</div>' +
    '</div>';
  }).join('');
  rvStep.textContent = (rvIndex+1) + ' / ' + reviewItems.length;
  rvBar.style.width = ((rvIndex+1) / reviewItems.length * 100) + '%';
  document.getElementById('rv-prev').disabled = rvIndex === 0;
  document.getElementById('rv-next').textContent = rvIndex === reviewItems.length-1 ? '完成' : '下一项';
}

/* Dragging */
let drag = null;
function onPointerDown(e){
  if(e.button && e.button !== 0) return;
  const el = e.currentTarget;
  if(mode === 'practice' && el.dataset.zone) return;
  if(overlay.classList.contains('show')) return;
  if(reviewEl.classList.contains('show')) return;
  const r = el.getBoundingClientRect();
  const ghost = el.cloneNode(true);
  ghost.classList.add('tile-ghost');
  ghost.style.width = r.width + 'px';
  ghost.style.height = r.height + 'px';
  ghost.style.left = r.left + 'px';
  ghost.style.top = r.top + 'px';
  document.body.appendChild(ghost);
  drag = { el, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY };
  el.classList.add('dragging');
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  e.preventDefault();
}
function onPointerMove(e){
  if(!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const z = zoneUnder(e.clientX, e.clientY);
  zones.forEach(zz=>zz.classList.toggle('hover', zz === z));
}
function zoneUnder(x, y){
  if(typeof x !== 'number' || typeof y !== 'number') return null;
  const g = drag && drag.ghost;
  let el = null;
  if(g) g.style.display = 'none';
  try { el = document.elementFromPoint(x, y); } catch(err){ el = null; }
  if(g) g.style.display = '';
  if(el){ const z = el.closest('.zone'); if(z) return z; }
  for(const z of zones){
    const r = z.getBoundingClientRect();
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return z;
  }
  return null;
}
function onPointerUp(e){
  if(!drag) return;
  const { el, ghost, sx, sy } = drag;
  const x = (e && typeof e.clientX === 'number') ? e.clientX : drag.x;
  const y = (e && typeof e.clientY === 'number') ? e.clientY : drag.y;
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.removeEventListener('pointercancel', onPointerUp);
  zones.forEach(z=>z.classList.remove('hover'));
  const z = zoneUnder(x, y);
  ghost.remove();
  el.classList.remove('dragging');
  drag = null;
  if(Math.hypot(x - sx, y - sy) < 6){ toggleSelect(el); return; }
  if(z){ place(el, z); return; }
  if(el.dataset.zone){ delete el.dataset.zone; pool.appendChild(el); el.classList.remove('ok','no'); update(); }
}

zones.forEach(z=>{
  z.addEventListener('click', ()=>{
    if(!selected) return;
    if(reviewEl.classList.contains('show')) return;
    place(selected, z);
  });
});

document.getElementById('m-practice').addEventListener('click', ()=>setMode('practice'));
document.getElementById('m-challenge').addEventListener('click', ()=>setMode('challenge'));
function setMode(m){
  mode = m;
  document.getElementById('m-practice').classList.toggle('active', m==='practice');
  document.getElementById('m-challenge').classList.toggle('active', m==='challenge');
  submitBtn.style.display = m==='challenge' ? '' : 'none';
  build();
}
submitBtn.addEventListener('click', checkAll);
document.getElementById('reset').addEventListener('click', ()=>{ overlay.classList.remove('show'); build(); });
document.getElementById('ov-again').addEventListener('click', ()=>{ overlay.classList.remove('show'); build(); });
document.getElementById('ov-review').addEventListener('click', startReview);
document.getElementById('rv-prev').addEventListener('click', ()=>{ if(rvIndex>0){ rvIndex--; renderReview(); }});
document.getElementById('rv-next').addEventListener('click', ()=>{
  if(rvIndex < reviewItems.length-1){ rvIndex++; renderReview(); }
  else { reviewEl.classList.remove('show'); }
});
document.getElementById('rv-exit').addEventListener('click', ()=>{ reviewEl.classList.remove('show'); });

/* 舞台缩放：contain 居中，非16:9留黑边不裁切 */
function fitStage(){
  const s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fitStage);
fitStage();

/* Fullscreen toggle */
function toggleFull(){
  if(document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());
}
document.getElementById('full').addEventListener('click', toggleFull);
window.addEventListener('keydown', e=>{
  if(e.key==='f' || e.key==='F'){
    const tag=e.target.tagName; if(tag==='INPUT'||tag==='TEXTAREA') return;
    toggleFull();
  }
});

build();
submitBtn.style.display = 'none';
</script>
