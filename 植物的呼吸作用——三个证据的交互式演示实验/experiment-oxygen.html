<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>实验一 · 种子萌发时吸收氧气</title>
  <link rel="stylesheet" href="./experiment-oxygen/experiment.css">
</head>
<body>
  <header class="topbar">
    <h1>植物的呼吸作用——三个证据的交互式演示实验</h1>
    <nav><button id="fullscreen-toggle" type="button" aria-pressed="false">页面全屏</button><button id="reset-view" type="button">复位视图</button><button id="reset-experiment" type="button">重新实验</button></nav>
  </header>
  <main class="lab-shell">
    <section class="viewport" aria-label="实验一三维交互场景">
      <canvas id="experiment-scene"></canvas>
      <nav class="experiment-switcher" aria-label="实验切换"><button class="active" type="button" data-experiment="oxygen" aria-current="page">实验一 · 种子萌发时吸收氧气</button><button type="button" data-experiment="carbon-dioxide">实验二 · 种子萌发时释放二氧化碳</button><button type="button" data-experiment="energy">实验三 · 种子萌发时释放能量</button></nav>
      <div class="scene-status" aria-live="polite"><strong id="scene-phase">准备实验</strong><span id="scene-hint">点击“开始实验”，全部材料将进入前方操作台。</span></div>
      <aside class="detail-inset" id="candle-detail" hidden aria-live="polite">
        <div class="detail-heading"><div><span id="detail-group">现象对照</span><strong>瓶内火焰细节</strong></div><div class="detail-actions"><output id="detail-time">0.0 s</output><button class="detail-expand" id="candle-detail-expand" type="button" aria-expanded="false">放大细节</button></div></div>
        <canvas id="candle-detail-canvas" aria-label="蜡烛火焰同步放大图"></canvas>
        <div class="detail-labels"><span><b>甲组</b><em id="detail-a-state">等待检验</em></span><span><b>乙组</b><em id="detail-b-state">等待检验</em></span></div>
        <div class="detail-copy"><span id="detail-status">蜡烛正在进入瓶内</span><i><b id="detail-progress"></b></i></div>
      </aside>
      <button class="start-overlay" id="start-experiment" type="button"><strong>开始实验</strong><span>将实验一全部材料移至操作台</span></button>
    </section>
    <aside class="control-panel">
      <div class="time-card"><span>窗外时间</span><output id="time-output">12:00</output><button id="advance-day" type="button" disabled>24小时后</button></div>
      <section class="current-step">
        <div class="step-kicker"><span id="step-number">准备</span><em id="group-badge">全部材料</em></div>
        <h2 id="step-title">材料进入操作台</h2>
        <p id="step-instruction">材料就位后，由你按照先甲组、后乙组的顺序完成每一步操作。</p>
        <output id="action-feedback">尚未开始</output>
      </section>
      <section class="step-navigation" aria-label="实验步骤导航">
        <div class="section-title"><strong>步骤导航</strong><span>跳转会重建完整前置状态</span></div>
        <div class="step-buttons" id="step-buttons">
          <button type="button" data-step="0">1 甲组装种</button><button type="button" data-step="1">2 乙组装种</button>
          <button type="button" data-step="2">3 甲组密封</button><button type="button" data-step="3">4 乙组密封</button>
          <button type="button" data-step="4">5 静置一夜</button><button type="button" data-step="5">6 检验甲瓶</button>
          <button type="button" data-step="6">7 检验乙瓶</button><button type="button" data-step="7">8 比较结论</button>
        </div>
        <div class="jump-row"><button id="previous-step" type="button">上一步</button><button id="next-step" type="button">下一步</button></div>
      </section>
      <section class="observations">
        <div class="section-title"><strong>现象记录</strong><span>完成检验后显示</span></div>
        <article id="observation-a"><b>甲瓶 · 萌发种子</b><span>等待检验</span></article>
        <article id="observation-b"><b>乙瓶 · 煮熟种子</b><span>等待检验</span></article>
      </section>
      <section class="conclusion" id="conclusion" hidden><strong>实验结论</strong><p>萌发的种子进行呼吸作用时会吸收氧气；煮熟的种子不能进行呼吸作用，是本实验的对照组。</p><button id="finish-experiment" type="button">结束实验并归位</button></section>
      <p class="view-help">拖动物体完成操作；拖动空白区域平移；滚轮或触控板缩放。步骤变化不会自动改变视角。</p>
    </aside>
  </main>
  <script src="./offline/series-bridge.js"></script>
  <script src="./offline/experiment-oxygen.js"></script>
</body>
</html>
